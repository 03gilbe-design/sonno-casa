<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sonno</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1219;--pn:#171b26;--pn2:#1e2332;--tx:#e9ebf2;--mu:#8b92a8;--ac:#6cb0ff;--bd:#2b3248;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;min-height:100%;padding:8px 10px calc(12px + env(safe-area-inset-bottom));gap:6px}
.riga{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select,button{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:0 12px;font:inherit;min-height:40px}
select{flex:1;min-width:0}
button:active{background:var(--pn2)}
button.on{border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.35}
.pic{min-width:46px;padding:0 8px}
#top{display:flex;flex-direction:column;gap:6px}
#titolo{flex:1;text-align:center;font-weight:600;letter-spacing:.2px;touch-action:pan-y;padding:8px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
canvas{width:100%;display:block;border-radius:var(--r);background:#0a0d14}
#ov,#lens{height:44px;touch-action:none}
#lens{outline:1px solid var(--ac)}
#cvbox{position:relative}
#main{touch-action:none}
#msg{color:var(--mu);font-size:12px;min-height:16px;transition:opacity .6s}
#sistema{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:6px;display:none}#sistema.on{display:block}#sistema iframe{width:100%;height:72vh;border:0;background:#fff;border-radius:8px}
#pan{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px}
#selinfo{font-weight:600}
#avviso{font-size:13px;color:#ffb36b}
#cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.cat{display:flex;align-items:center;gap:10px;min-height:56px;font-size:15px;text-align:left;border-radius:var(--r);border-left-width:6px;background:var(--pn2)}
button.cat .e{font-size:24px;line-height:1}
button.cat.cur{outline:2px solid #fff}

button.traccia{width:100%;min-height:64px;margin:8px 0;font-size:16px;font-weight:600;border-radius:var(--r);background:var(--pn2);border:1px dashed var(--ac);color:var(--tx);touch-action:none}
#orbe{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.72);touch-action:none}
#orbeL{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#orbeL path{fill:none;stroke:var(--ac);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.bolla{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--pn2);border:3px solid var(--bd);color:var(--tx);font-size:11px;line-height:1.1;text-align:center;pointer-events:none;transition:transform .08s}
.bolla .e{font-size:24px}
.bolla.su{transform:scale(1.18);border-color:#fff}
.bolla.off{opacity:.3}
#orbeTxt{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:18px;font-weight:700;pointer-events:none}
.nasc{display:none!important}
.mu{color:var(--mu);font-size:12px}
@media (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:auto auto minmax(0,1fr);height:100%;column-gap:10px;padding:6px 10px}
  #top{grid-column:1;grid-row:1}
  #ov,#lens{grid-column:1}
  #ov{grid-row:2}
  #lens{grid-row:2}
  #cvbox{grid-column:1;grid-row:3;min-height:0}
  #main{position:absolute;left:0;top:0}
  button.cat{min-height:48px}
}
#regole{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:8px;display:none;margin-top:6px}#regole.on{display:block}
.rgtab{display:flex;gap:6px;margin-bottom:6px}.rgtab button{flex:1}.rgtab button.on{border-color:var(--ac);color:var(--ac)}
#rgCerca{width:100%;box-sizing:border-box;margin-bottom:6px;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--pn2);color:var(--tx)}
.rgG{margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--pn2)}.rgG>summary{padding:8px;cursor:pointer;font-weight:600}
.rgR{border-top:1px solid var(--bd);padding:8px}.rgR h4{margin:0 0 3px;font-size:14px}.rgR p{margin:2px 0 4px;font-size:13px;line-height:1.35}
.rgR.contr{border-left:3px solid #f0a040}.rgR.off{opacity:.55}.rgB{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--bd);margin-left:4px;color:var(--mu)}
.rgR.contr .rgB{color:#f0a040;border-color:#f0a040}.rgN{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}.rgN span{font-size:11px;background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:1px 6px;font-variant-numeric:tabular-nums}
.rgF{font-size:10.5px;color:var(--mu);word-break:break-all}.rgNote{font-size:12px;color:#f0a040;margin:2px 0}
.rgSv{width:100%;height:auto;display:block;margin:4px 0;color:var(--tx)}.rgSeq{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:11.5px}.rgSeq b{background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:2px 6px;font-weight:400}
#rgCorpo table{border-collapse:collapse;font-size:11.5px;display:block;overflow-x:auto}#rgCorpo td,#rgCorpo th{border:1px solid var(--bd);padding:3px 5px;vertical-align:top}#rgCorpo h3{font-size:14px;margin:8px 0 4px}#rgCorpo pre{white-space:pre-wrap;background:var(--pn2);padding:8px;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="riga"><select id="selNotte"></select><select id="selUnita"></select><button id="bFull" class="pic" title="schermo intero / orizzontale">⛶</button></div>
    <div class="riga"><button id="bPrec" class="pic">◀</button><div id="titolo">…</div><button id="bSucc" class="pic">▶</button></div>
  </div>
  <canvas id="lens" class="nasc"></canvas><canvas id="ov"></canvas>
  <div id="cvbox"><canvas id="main"></canvas></div>
  <div id="ctl">
    <div class="riga" id="player">
      <button id="bm5" class="pic">−5s</button><button id="bPlay" class="pic">▶</button><button id="bp5" class="pic">+5s</button>
      <button id="bVel" class="pic">1×</button><button id="bSegui" class="pic on">segui</button>
      <span id="selAudio" class="riga" aria-label="Dispositivo da etichettare"></span>
      <span id="ora" class="mu" style="flex:1;text-align:right;min-width:110px"></span>
    </div>
    <div class="riga">
      <button id="bzm" class="pic">🔍−</button><button id="bzp" class="pic">🔍+</button><button id="bGp" class="pic nasc">◀ gruppo</button><button id="bTutto" class="pic">tutto</button><button id="bGn" class="pic nasc">gruppo ▶</button>
      <button id="bNuova" class="pic">＋ nuova</button><button id="bTaglia" class="pic">✂ taglia qui</button><button id="bConf" class="pic">✓ conferma tutto</button>
      <button id="bSnap" class="pic on">snap ½s</button><button id="bUndo" class="pic" disabled>↩ annulla</button>
      <span id="vis" class="mu" style="flex:1;text-align:right"></span>
    </div>
    <div id="pan" class="nasc">
      <div id="selinfo"></div><div id="avviso" class="nasc"></div>
      <div class="riga"><button id="bSel" class="pic">▶ ascolta</button><button id="bSelNull" class="pic">✕ chiudi</button>
        <button id="bConfPezzo" class="nasc">✓ conferma</button><button id="bAltra" class="nasc">➕ altra categoria</button><button id="bDel" class="nasc">🗑 cancella</button></div>
      <div class="riga" id="nudge">
        <button data-n="i-1" class="pic">inizio −1s</button><button data-n="i+1" class="pic">+1s</button>
        <button data-n="f-1" class="pic">fine −1s</button><button data-n="f+1" class="pic">+1s</button>
        <button data-n="i-.1" class="pic">−.1</button><button data-n="i+.1" class="pic">+.1</button>
        <button data-n="f-.1" class="pic">−.1</button><button data-n="f+.1" class="pic">+.1</button>
      </div>
      <button id="bTraccia" class="traccia">✍ tieni premuto e traccia la categoria</button>
      <div id="cats"></div>
    </div>
    <div id="orbe" class="nasc"><svg id="orbeL"></svg></div>
    <div class="mu" id="aiuto">Trascina = seleziona · doppio tocco = evento intero · tagli (⋮) trascinabili, tieni premuto = elimina · riga tratteggiata = bozza proposta</div>
    <button id="bSistema">Sistema</button><div id="sistema"><div id="sistemaOra" class="mu">non aggiornato</div><iframe id="grafo" title="Grafo dipendenze sistema sonno" src="/grafo_stati.html"></iframe></div><button id="bRegole">Regole e numeri</button><div id="regole"><div class="rgtab"><button data-v="regole" class="on">Regole</button><button data-v="numeri">Numeri</button><button data-v="detto">Cosa ti ho detto</button></div><input id="rgCerca" placeholder="cerca (es. russare, 20 min, musica)"><div id="rgCorpo" class="mu">tocca per caricare</div></div><div id="msg"></div>
  </div>
</div>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const $ = id => document.getElementById(id);
const INIT = (tg && tg.initData) || new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
// stesso EMO di copy/testi.py (+ qualche altra categoria del bot)
const EMO = {silenzio:"🤫", ambiente:"🤫", movimento:"🛏️", russa:"💤", respiro:"🌬️", tosse:"🤧", voce:"🗣️", sbuffo:"💨", musica:"🎵", tiktok:"🎵🗣️",
  io_che_mi_muovo_nel_lett:"🛏️", tiro_sul_con_il_naso:"👃", risata:"😄", rumori:"🔊", starnuto:"🤧", tastiera:"⌨️", aspirapolvere:"🧹", respiro_sibilio_affa:"🌬️"};
const PERSONA = new Set(["russa","respiro","movimento","tosse","sbuffo","starnuto","io_che_mi_muovo_nel_lett","tiro_sul_con_il_naso","respiro_sibilio_affa"]);
// palette come le mappe: russare rossi, respiro blu, movimento ocra, silenzio beige; i modelli piu' precisi piu' scuri
const HSL = {russa:[4,70], respiro:[208,62], movimento:[37,78], silenzio:[40,34], tosse:[330,45], voce:[262,45], sbuffo:[165,45], musica:[285,40], tiktok:[300,42]};
const base = c => (c || "").split("/")[0];
function colore(c, L = 56) { const b = base(c); let h, s; if (HSL[b]) [h, s] = HSL[b]; else { h = 0; for (const ch of b) h = (h*31 + ch.charCodeAt(0)) % 360; s = 45; } return `hsl(${h},${s}%,${L}%)`; }
const LIVL = {BASSO: 74, MEDIO: 58, PRECISO: 38};
const emo = c => EMO[base(c)] || "▫️";
const nome = c => (c || "").replace(/_/g, " ");

async function api(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"X-Init-Data": INIT, ...(body ? {"Content-Type": "application/json"} : {})}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 403) throw new Error("403");
  return r;
}
let msgT = 0;
function msg(t, err, fade) { const m = $("msg"); m.textContent = t || ""; m.style.color = err ? "#ff7b7b" : ""; m.style.opacity = 1; clearTimeout(msgT); if (fade) msgT = setTimeout(() => m.style.opacity = .35, 2500); }

// ---------- stato
let EL = null, B = null, SP = null;
let V = {a: 0, span: 1800};
let SEL = null, CUR = null;
let PZ = [], curP = -1, HEAD = 0, TOKT = 0;
let dispositivoAudio = 'a21s';
let sistemaVisibile=false, sistemaTimer=0, ultimoSistema=null;
async function aggiornaSistema(){try{const j=await(await api('/api/sistema')).json();ultimoSistema=j;$('sistemaOra').textContent='aggiornato alle '+new Date(j._t).toLocaleTimeString('it-IT');$('grafo').contentWindow.postMessage({tipo:'sistema',stati:j,dettagli:j._dettagli},location.origin)}catch(e){}}
function mostraSistema(v){sistemaVisibile=v;$('sistema').classList.toggle('on',v);if(v){aggiornaSistema();sistemaTimer=setInterval(aggiornaSistema,30000)}else clearInterval(sistemaTimer)}
$('bSistema').onclick=()=>mostraSistema(!sistemaVisibile);
$('grafo').onload=()=>{if(ultimoSistema)$('grafo').contentWindow.postMessage({tipo:'sistema',stati:ultimoSistema,dettagli:ultimoSistema._dettagli},location.origin)};
try { dispositivoAudio = localStorage.getItem('sonno_dispositivo') || dispositivoAudio; } catch (e) {}
let segui = true, vel = 1, loopSel = false, snap = true;
const UNDO = [];
let CL = [];                              // gruppi di registrazione: pezzi con buchi < 90 s fra loro (l'ora di clip e' quasi tutta vuota)
function gruppi(pz) { const o = []; for (const p of pz.slice().sort((a, b) => a.i - b.i)) { const l = o[o.length - 1]; if (l && p.i - l.f < 90) l.f = Math.max(l.f, p.f); else o.push({i: p.i, f: p.f}); } return o; }
function vaiGruppo(c) { if (!c) return; V.span = Math.min(B.dur, Math.max(30, c.f - c.i + 20)); V.a = clampA(c.i - 10); HEAD = c.i; au.pause(); }
function ovRange() { if (!B) return [0, 1]; if (B.tipo !== "ora" || !CL.length) return [0, B.dur]; return [Math.max(0, CL[0].i - 20), Math.min(B.dur, CL[CL.length - 1].f + 20)]; }
let DRAFT = null;                         // tagli proposti {grosso, medio, fine}: pezzi consecutivi {id,i,f,cat,src}
const livZoom = () => V.span > 600 ? "grosso" : V.span > 60 ? "medio" : "fine";
const au = new Audio(); au.preload = "auto";

const fmt = s => { s = Math.max(0, s); const t = Math.floor(s); return String(Math.floor(t/3600)%24).padStart(2,"0") + ":" + String(Math.floor(t%3600/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); };
const sod = iso => +iso.slice(11,13)*3600 + +iso.slice(14,16)*60 + +iso.slice(17,19);
const clock = t => fmt(B.t0s + t);
const sn = t => snap ? Math.round(t*2)/2 : Math.round(t*10)/10;

// ---------- avvio e selettori
async function avvia() {
  if (!INIT) return msg("Apri da Telegram: tocca 🎧 in @IlTuoBot", true);
  try { EL = await (await api("/api/elenco")).json(); } catch (e) { return msg(e.message === "403" ? "Non autorizzato (apri da Telegram)" : "Server non raggiungibile", true); }
  // (alle 17 "stasera" ha gia' 10 blocchi del pomeriggio: conta solo una notte con blocchi fra mezzanotte e le 7)
  const nr = EL.notti.find(x => x.sonno || x.blocchi.some(b => +b.t0.slice(11, 13) < 7)) || EL.notti[0], u = null, notte = nr && nr.notte;
  riempiNotti(notte); if (EL.drive_errore) msg(EL.drive_errore, true);
  const n = EL.notti.find(n => n.notte === notte) || {blocchi: [], ore: []}, l = n.blocchi.length ? n.blocchi : n.ore;
  // e dentro il blocco il primo minuto di russare (inizio_russa dal server)
  const russ = n.blocchi.filter(x => x.russa).sort((p, q) => p.t0 < q.t0 ? -1 : 1)[0];
  const bs = !russ && n.sonno ? n.blocchi.find(x => fineIso(x) > n.sonno[0]) : null;
  const zs = bs ? Math.max(0, (Date.parse(n.sonno[0] + ":00Z") - Date.parse(bs.t0.slice(0, 19) + "Z")) / 1000) : null;
  const first = (russ && russ.id) || (bs && bs.id) || (l.length ? l[l.length-1].id : null);
  if (first) await apri(first, russ && russ.id === first ? "russa" : bs && bs.id === first ? {i: zs, f: zs + 60} : (u && u.unita === first ? u : null)); else msg("Nessuna registrazione disponibile");
}
function rr(g, x, y, w, h, r) { r = Math.min(r, w/2, h/2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const nl = n => { const d = new Date(Date.UTC(+n.slice(0,4), +n.slice(4,6)-1, +n.slice(6,8)-1)); return `${String(d.getUTCDate()).padStart(2,"0")}→${n.slice(6,8)}/${n.slice(4,6)}`; };
const giornoStr = k => { const d = new Date(); d.setDate(d.getDate() + k); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; };
const nomeNotte = n => n === giornoStr(1) ? "stasera" : n === giornoStr(0) ? "stanotte" : n === giornoStr(-1) ? "ieri notte" : "notte " + nl(n);
function riempiNotti(sel) {
  $("selNotte").innerHTML = EL.notti.map(n => `<option value="${n.notte}">${nomeNotte(n.notte)} · ${n.blocchi.length} blocchi ${n.ore.length ? "· " + n.ore.length + " ore" : ""}</option>`).join("");
  $("selNotte").value = sel; riempiUnita();
}
function riempiUnita(sel) {
  const n = EL.notti.find(x => x.notte === $("selNotte").value); if (!n) return;
  const opt = x => `<option value="${x.id}">${x.t0.slice(11,16)}–${fineBl(x)}${x.russa == null ? "" : x.russa ? " · russa " + x.russa + "'" : " · silenzio"}</option>`;
  const dorme = x => n.sonno && x.t0.slice(0,16) < n.sonno[1] && fineIso(x) > n.sonno[0];
  const bs = n.blocchi.filter(dorme), altri = n.blocchi.filter(x => !dorme(x));
  $("selUnita").innerHTML = (bs.length ? `<optgroup label="Mentre dormivi ${n.sonno[0].slice(11,16)}–${n.sonno[1].slice(11,16)}">${bs.map(opt).join("")}</optgroup>` : "") +
    (altri.length ? `<optgroup label="${bs.length ? "Resto del giorno" : "Blocchi 30 min"}">${altri.map(opt).join("")}</optgroup>` : "") +
    (n.ore.length ? `<optgroup label="Ore (solo clip)">${n.ore.map(x => `<option value="${x.id}">${x.t0.slice(11,13)}:00–${String((+x.t0.slice(11,13)+1)%24).padStart(2,"0")}:00 · ${x.n} clip</option>`).join("")}</optgroup>` : "");
  if (sel) $("selUnita").value = sel;
}
function fineIso(x) { const d = new Date(new Date(x.t0).getTime() + (x.dur || 0) * 1000); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + "T" + fineBl(x); }
function fineBl(x) { const d = new Date(new Date(x.t0).getTime() + (x.dur || 0) * 1000); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
$("selNotte").onchange = () => { riempiUnita(); const n = EL.notti.find(x => x.notte === $("selNotte").value), x = ((n.sonno && n.blocchi.find(b => fineIso(b) > n.sonno[0])) || n.blocchi[0] || n.ore[0]); if (x) apri(x.id); };
$("selUnita").onchange = () => apri($("selUnita").value);

async function apri(id, zona) {
  if (B && DRAFT) salvaBozzeVisibili();
  au.pause(); SEL = null; CUR = null; SP = null; DRAFT = null; B = null; PZ = []; CL = []; curP = -1; HEAD = 0; loopSel = false; msg("carico…"); disegna(); pannello();
  let b;
  try { b = await (await api("/api/blocco?id=" + encodeURIComponent(id))).json(); } catch (e) { return msg("Errore di rete", true); }
  if (!b.dur) return msg("Nessuna registrazione qui", true);
  if (zona === "russa") zona = b.inizio_russa != null ? {i: b.inizio_russa, f: b.inizio_russa + 60} : null;
  b.t0s = sod(b.t0); B = b; PZ = b.pezzi; aggiornaDispositivi(); PZ = dispositivoAudio === 'a21s' ? B.pezzi : (B.ascolti?.[dispositivoAudio] || []); TOKT = Date.now(); CL = gruppi(PZ); $('bGp').classList.toggle('nasc', CL.length < 2); $('bGn').classList.toggle('nasc', CL.length < 2); if (b.drive) msg('da Drive · preparo audio…');
  $("selNotte").value = b.notte; riempiUnita(b.id);
  $("titolo").textContent = `${b.t0.slice(8,10)}/${b.t0.slice(5,7)} ${b.t0.slice(11,16)}` + (b.tipo === "blocco" ? " · blocco 30 min" : `–${String((+b.t0.slice(11,13)+1)%24).padStart(2,"0")}:00 · solo clip`);
  if (zona && zona.i != null) { const l = Math.max(zona.f - zona.i, 1), sp = Math.min(Math.max(l*3, 30), b.dur); V.span = sp; V.a = clampA(zona.i - (sp - l)/2); HEAD = zona.i; }

  const nc = R.filter(r => r.stato === "contraddizione").length;
  c.innerHTML = `<div class="mu">${R.length} regole${nc ? ` · <span style="color:#f0a040">${nc} contraddizioni</span>` : ""} · estratte dal codice, con file:riga</div>` +
    Object.entries(G).map(([g, rs]) => `<details class="rgG"${q ? " open" : ""}><summary>${rgEsc(g)} · ${rs.length}${rs.some(r => r.stato === "contraddizione") ? " ⚠" : ""}</summary>${rs.map(rgRegola).join("")}</details>`).join("");
}
async function rgCarica() {
  try { RG = await (await api("/api/regole")).json(); } catch (e) { $("rgCorpo").textContent = "Non riesco a caricare le regole (" + e.message + ")"; return; }
  rgDisegna();
}
$("bRegole").onclick = () => { const on = !$("regole").classList.contains("on"); $("regole").classList.toggle("on", on); if (on && !RG) rgCarica(); };
document.querySelectorAll(".rgtab button").forEach(b => b.onclick = () => { rgVista = b.dataset.v; document.querySelectorAll(".rgtab button").forEach(x => x.classList.toggle("on", x === b)); rgDisegna(); });
$("rgCerca").oninput = rgDisegna;
</script>
</body>
